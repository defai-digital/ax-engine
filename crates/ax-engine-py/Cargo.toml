[package]
name = "ax-engine-py"
edition.workspace = true
license.workspace = true
publish = false
version.workspace = true
description = "Preview Python bindings for AX Engine"
build = "build.rs"

[lib]
name = "_ax_engine"
crate-type = ["cdylib", "rlib"]

[features]
default = []
python-extension = ["pyo3/extension-module"]

[dependencies]
ax-engine-sdk = { path = "../ax-engine-sdk", features = ["mlx-native"] }
# Keep mlx-sys as a direct dependency so build.rs receives the authoritative
# DEP_MLX_LIB_DIR selected by mlx-sys and can embed it in Python test binaries.
mlx-sys = { path = "../mlx-sys" }
pyo3 = { version = "0.29", features = ["abi3-py311"] }
serde.workspace = true
serde_json.workspace = true

[lints]
workspace = true

[build-dependencies]
pyo3-build-config = { version = "0.29", features = ["resolve-config"] }
