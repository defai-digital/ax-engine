[package]
name = "ax-engine-bench"
edition.workspace = true
license.workspace = true
publish = false
version.workspace = true

[dependencies]
ax-engine-core = { path = "../ax-engine-core" }
ax-engine-mlx = { path = "../ax-engine-mlx" }
ax-engine-sdk = { path = "../ax-engine-sdk", features = ["mlx-native", "tokenizer"] }
mlx-sys = { path = "../mlx-sys" }
pulldown-cmark.workspace = true
ratatui.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["arbitrary_precision", "float_roundtrip"] }
thiserror.workspace = true
tracing-subscriber.workspace = true
tui-scrollview.workspace = true
unicode-width.workspace = true

[lints]
workspace = true

[[bin]]
name = "ax-engine"
path = "src/bin/ax-engine.rs"
