<title id="title">Qwen 3.8 Flash Next AXQ MXFP4 on M5 Max</title>
<desc id="desc">A comparison of single-request decode and effective prompt prefill. The engine labels identify each version and greedy mode. Zero indicates the tested configuration did not complete the workload.</desc>
