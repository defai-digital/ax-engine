<svg xmlns="http://www.w3.org/2000/svg" width="750" height="440" viewBox="0 0 750 440" role="img" aria-labelledby="title desc">
<title id="title">Qwen 3.8 MXFP4 serving on M5 Max</title>
<desc id="desc">Two horizontal bar charts use the same zero to 100 output tokens per second scale. AX Engine runs direct decode. Splash uses DFlash2 for 27B. A zero indicates the engine did not complete the workload.</desc>
<rect x="0.5" y="0.5" width="749" height="439" rx="16" fill="#f7f9fc" stroke="#d8e2ef"/>
<g font-family="system-ui, sans-serif" fill="#18283f">
<text x="25" y="38" font-size="23" font-weight="700">Qwen 3.8 MXFP4 serving</text>
<text x="25" y="63" font-size="14" fill="#425674">MacBook Pro M5 Max 128 GB · One streaming request · Output tok/s</text>
<text x="25" y="108" font-size="17" font-weight="700">Qwen 3.8 27B</text>
<line x1="120" x2="120" y1="140" y2="382" stroke="#d8e2ef"/><text x="120" y="133" font-size="11" fill="#425674" text-anchor="middle">0</text>
<line x1="170" x2="170" y1="140" y2="382" stroke="#d8e2ef"/><text x="170" y="133" font-size="11" fill="#425674" text-anchor="middle">25</text>
