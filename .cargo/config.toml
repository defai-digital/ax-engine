[env]
# MLX/Metal runtime state is thread-local but process-shared enough that the
# ax-engine-mlx unit suite can crash under libtest's default parallel runner.
# Keep the repository test harness deterministic unless a caller overrides it.
RUST_TEST_THREADS = "1"
# MLX 0.32 multiplies float32 on Neural Accelerator GPUs (M5 and later) in TF32,
# about 1e-5 relative error. That fails the float32 oracle comparisons in the
# ax-engine-mlx unit suite (13 qwen4_exp tests pinned at 2e-6) while the same
# tests pass on earlier GPUs. Run the suite at full float32 precision; callers
# can still override it.
MLX_ENABLE_TF32 = "0"
# MLX picks the Neural Accelerator gated-delta kernel (chunk 16) on M5 and later
# and the simdgroup kernel elsewhere; its own tests allow the accelerator variant
# atol 1e-1 against 1e-4 for the others. Our gate-parity check measures 6.4e-5
# against a 5e-5 bound on the accelerator kernel, so pin the architecture-
# independent simdgroup route (GATED_DELTA_CHUNK=8) for the unit suite.
GATED_DELTA_CHUNK = "8"
