name: Brew Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to update the tap for (e.g. v6.0.1). The signed release must already exist."
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Only needs to read the release assets; the tap push uses TAP_PUSH_TOKEN.
permissions:
  contents: read

env:
  MAIN_REPO: defai-digital/ax-engine
  TAP_REPO: defai-digital/homebrew-tap
  TAP_FORMULA: Formula/ax-engine.rb
  RELEASE_PAYLOADS: ax-engine ax-engine-server ax-engine-bench ax-engine-download-model.py ax-engine-prepare-mtp-sidecar.py ax-engine-prepare-gemma4-assistant-mtp.py ax-engine-prepare-glm-mtp-sidecar.py ax-engine-prepare-qwen36-mtp-sidecar.py ax-engine-check-mtp-sidecar-provenance.py
  RELEASE_RUNTIME_PAYLOADS: libmlx.dylib libjaccl.dylib mlx.metallib

jobs:
  update-tap:
    name: Update Homebrew tap formula
    # Formula metadata only: AX Engine is neither built nor executed here.
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Resolve tag
        id: tag
        run: |
          TAG="${{ inputs.tag }}"
          if [[ -z "$TAG" ]]; then
            echo "error: could not determine release tag" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.tag.outputs.tag }}
          # Don't install a global github.com credential helper: it would override the
          # TAP_PUSH_TOKEN embedded in the tap clone URL and make the tap push
          # authenticate as the default Actions identity (403 to the tap repo).
          persist-credentials: false

      - name: Verify tag matches all SDK versions
        run: python3 scripts/check_version_sync.py --expected "${{ steps.tag.outputs.tag }}"

      - name: Install Minisign
        run: sudo apt-get update && sudo apt-get install -y minisign

      - name: Download and verify signed release asset
        id: asset
        run: |
          set -euo pipefail

          TAG="${{ steps.tag.outputs.tag }}"
          ARCHIVE="ax-engine-${TAG}-macos-arm64.tar.gz"
          MANIFEST="ax-engine-${TAG}-macos-arm64.manifest.json"
          DOWNLOAD_URL="https://github.com/${MAIN_REPO}/releases/download/${TAG}/${ARCHIVE}"

          # Refuse draft releases: draft assets must not land in the public formula.
          is_draft="$(gh release view "$TAG" --repo "$MAIN_REPO" --json isDraft --jq .isDraft)"
          if [[ "$is_draft" != "false" ]]; then
            echo "error: release $TAG is still a draft; refusing to update Homebrew" >&2
            exit 1
          fi

          # Re-download and independently verify the published bytes before
          # trusting their checksum in the Homebrew formula.
          gh release download "$TAG" --repo "$MAIN_REPO" \
            --pattern "$ARCHIVE" \
            --pattern "${ARCHIVE}.minisig" \
            --pattern "${ARCHIVE}.sha256" \
            --pattern "${ARCHIVE}.sha256.minisig" \
            --pattern "$MANIFEST" \
            --pattern "${MANIFEST}.minisig" \
            --pattern "ax-minisign.pub" \
            --dir /tmp \
            --clobber

          for asset in \
            "$ARCHIVE" \
            "${ARCHIVE}.minisig" \
            "${ARCHIVE}.sha256" \
            "${ARCHIVE}.sha256.minisig" \
            "$MANIFEST" \
            "${MANIFEST}.minisig" \
            "ax-minisign.pub"; do
            [[ -f "/tmp/$asset" ]] || {
              echo "error: $asset not found on release $TAG." >&2
              exit 1
            }
          done

          cmp docs/ax-minisign.pub /tmp/ax-minisign.pub
          for asset in "$ARCHIVE" "${ARCHIVE}.sha256" "$MANIFEST"; do
            minisign -V \
              -p docs/ax-minisign.pub \
              -m "/tmp/$asset" \
              -x "/tmp/${asset}.minisig"
          done

          SHA256="$(awk '{print $1}' "/tmp/${ARCHIVE}.sha256")"
          if [[ ! "$SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "error: could not parse a sha256 from the sidecar: '${SHA256}'" >&2
            exit 1
          fi
          ACTUAL_SHA256="$(sha256sum "/tmp/$ARCHIVE" | awk '{print $1}')"
          [[ "$ACTUAL_SHA256" == "$SHA256" ]] || {
            echo "error: signed SHA256 sidecar does not match $ARCHIVE" >&2
            exit 1
          }

          read -r -a runtime_payloads <<< "$RELEASE_RUNTIME_PAYLOADS"
          {
            echo "archive=$ARCHIVE"
            echo "manifest=$MANIFEST"
            echo "sha256=$SHA256"
            echo "download_url=$DOWNLOAD_URL"
            python3 - \
              "/tmp/${MANIFEST}" \
              "/tmp/${ARCHIVE}" \
              "$ARCHIVE" \
              "$SHA256" \
              "$(tr -d '[:space:]' < mlx.version)" \
              "${runtime_payloads[@]}" <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import sys
          import tarfile
          from pathlib import Path

          manifest = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          archive_path = Path(sys.argv[2])
          expected_archive = sys.argv[3]
          expected_sha256 = sys.argv[4]
          expected_mlx_version = sys.argv[5]
          expected_runtime = set(sys.argv[6:])
          archive = manifest.get("archive") or {}
          code_signing = manifest.get("code_signing") or {}
          runtime = manifest.get("mlx_runtime") or {}
          runtime_assets = runtime.get("assets") or {}
          runtime_source = runtime.get("source") or {}
          runtime_source_assets = runtime_source.get("assets") or {}
          runtime_derivation = runtime.get("derivation") or {}
          licenses = manifest.get("third_party_licenses") or {}
          apple_signed = bool(code_signing.get("apple_developer_id"))
          apple_notarized = bool(code_signing.get("notarized"))
          if manifest.get("schema_version") != "ax.github_release_manifest.v3":
              raise SystemExit("Homebrew requires the standalone v3 release manifest")
          if archive.get("name") != expected_archive or archive.get("sha256") != expected_sha256:
              raise SystemExit("release manifest archive identity does not match verified bytes")
          if not apple_signed or not apple_notarized:
              raise SystemExit("Homebrew release requires Developer ID signing and Apple notarization")
          if code_signing.get("disable_library_validation") is not False:
              raise SystemExit("standalone release unexpectedly disables library validation")
          if runtime.get("version") != expected_mlx_version:
              raise SystemExit("release MLX runtime version does not match mlx.version")
          if runtime.get("layout") != "colocated":
              raise SystemExit("release MLX runtime is not declared colocated")
          if runtime.get("rpaths") != ["@loader_path", "@loader_path/../libexec"]:
              raise SystemExit("release does not support both archive and Homebrew rpaths")
          if set(runtime_assets) != expected_runtime:
              raise SystemExit("release MLX runtime file set is incomplete")
          if runtime_source.get("kind") != "pinned-pypi-wheel":
              raise SystemExit("release MLX source is not the pinned pip wheel")
          if set(runtime_source_assets) != expected_runtime:
              raise SystemExit("release upstream MLX runtime file set is incomplete")
          for name, record in runtime_source_assets.items():
              source_sha256 = record.get("sha256") if isinstance(record, dict) else None
              if (
                  not isinstance(record, dict)
                  or record.get("path") != name
                  or not isinstance(record.get("size"), int)
                  or record.get("size", -1) < 0
                  or not isinstance(source_sha256, str)
                  or len(source_sha256) != 64
                  or any(character not in "0123456789abcdef" for character in source_sha256)
              ):
                  raise SystemExit(f"release upstream MLX record is invalid for {name}")
          if runtime_derivation != {
              "private_copy": True,
              "dylib_load_commands_preserved": True,
              "metallib_byte_identical": True,
              "library_signature": "developer-id",
          }:
              raise SystemExit("release MLX derivation contract is incorrect")
          if set(licenses) != {"MLX-LICENSE.txt"}:
              raise SystemExit("release MLX license is missing")

          with tarfile.open(archive_path, "r:gz") as release:
              members = {
                  member.name.removeprefix("./"): member
                  for member in release.getmembers()
                  if member.isfile()
              }
              if set(members) != set(manifest.get("payload") or []):
                  raise SystemExit("release archive members do not match its manifest")
              for name, record in {**runtime_assets, **licenses}.items():
                  member = members.get(name)
                  if member is None:
                      raise SystemExit(f"release archive is missing {name}")
                  source = release.extractfile(member)
                  if source is None:
                      raise SystemExit(f"could not read release archive member {name}")
                  digest = hashlib.sha256()
                  for chunk in iter(lambda: source.read(1024 * 1024), b""):
                      digest.update(chunk)
                  if record.get("path") != name or record.get("sha256") != digest.hexdigest():
                      raise SystemExit(f"release manifest digest mismatch for {name}")
                  if record.get("size") != member.size:
                      raise SystemExit(f"release manifest size mismatch for {name}")
          print(f"apple_signed={str(apple_signed).lower()}")
          print(f"apple_notarized={str(apple_notarized).lower()}")
          print(f"mlx_version={runtime['version']}")
          PY
          } >> "$GITHUB_OUTPUT"
          echo "Resolved checksum from signed release asset: $SHA256"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Homebrew tap formula
        run: |
          set -euo pipefail

          TAG="${{ steps.tag.outputs.tag }}"
          VERSION="${{ steps.tag.outputs.version }}"
          SHA256="${{ steps.asset.outputs.sha256 }}"
          DOWNLOAD_URL="${{ steps.asset.outputs.download_url }}"

          TAP_DIR="$(mktemp -d /tmp/ax-engine-tap.XXXXXX)"
          trap 'rm -rf "$TAP_DIR"' EXIT

          git clone \
            "https://x-access-token:${TAP_PUSH_TOKEN}@github.com/${TAP_REPO}.git" \
            --depth=1 --quiet \
            "$TAP_DIR"

          cd "$TAP_DIR"
          git config user.name  "Automatosx"
          git config user.email "automatosx@defai.digital"

          FORMULA_PATH="$TAP_DIR/$TAP_FORMULA"
          if [[ ! -f "$FORMULA_PATH" ]]; then
            echo "error: $TAP_FORMULA not found in tap" >&2
            exit 1
          fi

          # The checked-in formula is canonical. Refresh the tap's structure
          # from the exact workflow revision before applying release metadata,
          # so deployment-layout changes cannot depend on a manual tap edit.
          gh api \
            -H "Accept: application/vnd.github.raw+json" \
            "repos/${GITHUB_REPOSITORY}/contents/packaging/homebrew/Formula/ax-engine.rb?ref=${TOOLING_SHA}" \
            > "$FORMULA_PATH"

          # GNU sed (ubuntu runner): in-place edit without the BSD '' backup arg.
          sed -i \
            -e "s|version \"[^\"]*\"|version \"${VERSION}\"|" \
            -e "s|url \"[^\"]*\"|url \"${DOWNLOAD_URL}\"|" \
            -e "s|sha256 \"[^\"]*\"|sha256 \"${SHA256}\"|" \
            "$FORMULA_PATH"

          # Verify all three substitutions landed
          for pattern in "version \"${VERSION}\"" "url \"${DOWNLOAD_URL}\"" "sha256 \"${SHA256}\""; do
            if ! grep -qF "$pattern" "$FORMULA_PATH"; then
              echo "error: formula update failed — pattern not found: $pattern" >&2
              exit 1
            fi
          done

          read -r -a release_payloads <<< "$RELEASE_PAYLOADS"
          gh api \
            -H "Accept: application/vnd.github.raw+json" \
            "repos/${GITHUB_REPOSITORY}/contents/scripts/update_homebrew_bin_install.py?ref=${TOOLING_SHA}" \
            | python3 - "$FORMULA_PATH" "${release_payloads[@]}"

          if [[ "$(grep -c '^[[:space:]]*bin\.install\b' "$FORMULA_PATH" || true)" -ne 1 ]]; then
            echo "error: formula must contain exactly one bin.install statement" >&2
            exit 1
          fi
          for payload in "${release_payloads[@]}"; do
            if ! grep -qF "\"${payload}\"" "$FORMULA_PATH"; then
              echo "error: formula is missing release payload: ${payload}" >&2
              exit 1
            fi
          done

          # Fail closed on the self-contained bin/libexec install contract. Homebrew
          # must preserve the signed binaries instead of rewriting them.
          for required in \
            'libexec.install "libmlx.dylib", "libjaccl.dylib", "mlx.metallib"' \
            'doc.install "MLX-LICENSE.txt"' \
            'without rewriting the signed Mach-O files'; do
            if ! grep -qF "$required" "$FORMULA_PATH"; then
              echo "error: formula missing standalone runtime marker: $required" >&2
              exit 1
            fi
          done
          for forbidden in \
            'relink_release_binaries_to_tap_mlx!' \
            'change_install_name' \
            'defai-digital/ax-engine/mlx-c' \
            'defai-digital/ax-engine/mlx"'; do
            if grep -qF "$forbidden" "$FORMULA_PATH"; then
              echo "error: formula still contains obsolete MLX relinking: $forbidden" >&2
              exit 1
            fi
          done

          ruby -c "$FORMULA_PATH" > /dev/null
          echo "Formula syntax OK"

          git add "$TAP_FORMULA"
          if git diff --cached --quiet; then
            echo "Formula already up to date — nothing to commit"
            exit 0
          fi

          echo "Formula diff:"
          git diff --cached "$TAP_FORMULA"

          git commit -m "chore: update ax-engine to ${TAG}"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              break
            fi
            if [[ "$attempt" -eq 5 ]]; then
              echo "error: shared tap changed repeatedly; push failed" >&2
              exit 1
            fi
            sleep $((attempt * 2))
          done
          echo "Tap updated: ${TAP_REPO}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAP_PUSH_TOKEN: ${{ secrets.TAP_TOKEN || secrets.HOMEBREW_TAP_TOKEN }}
          TOOLING_SHA: ${{ github.workflow_sha }}

      - name: Step summary
        if: always()
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          SHA256="${{ steps.asset.outputs.sha256 }}"
          ARCHIVE="${{ steps.asset.outputs.archive }}"
          MANIFEST="${{ steps.asset.outputs.manifest }}"
          DOWNLOAD_URL="${{ steps.asset.outputs.download_url }}"
          APPLE_SIGNED="${{ steps.asset.outputs.apple_signed }}"
          APPLE_NOTARIZED="${{ steps.asset.outputs.apple_notarized }}"
          MLX_VERSION="${{ steps.asset.outputs.mlx_version }}"

          {
            echo "## Brew Release: ${TAG}"
            echo
            echo "Tap formula updated to point at the signed release asset (not rebuilt)."
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Archive | \`${ARCHIVE}\` |"
            echo "| Manifest | \`${MANIFEST}\` |"
            echo "| SHA256 | \`${SHA256}\` |"
            echo "| Apple signed | \`${APPLE_SIGNED}\` |"
            echo "| Apple notarized | \`${APPLE_NOTARIZED}\` |"
            echo "| Bundled MLX | \`${MLX_VERSION}\` |"
            echo "| Download | ${DOWNLOAD_URL} |"
            echo "| Tap | \`${TAP_FORMULA}\` in \`${TAP_REPO}\` |"
            echo
            echo "\`\`\`"
            echo "brew install defai-digital/tap/ax-engine"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"
